<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il neurone giocattolo — Lezione 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --bg: #15120f;
    --bg-card: #1e1a15;
    --bg-light: #29231d;
    --border: #3c332a;
    --text: #f4eee3;
    --text-dim: #d2c8b8;
    --text-muted: #a89a83;
    --success: #6fae5c;
    --danger: #e0563a;
    --warn: #d9a441;
    --info: #4e93b8;
    --purple: #a879c4;
    --fs-xs: clamp(14px, 0.7vw + 11px, 16px);
    --fs-sm: clamp(16px, 0.85vw + 12px, 18px);
    --fs-body: clamp(18px, 1vw + 13px, 21px);
    --fs-h2: clamp(26px, 2vw + 16px, 36px);
    --lh-body: 1.55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { background: var(--bg); color: var(--text); font-family: 'Public Sans', sans-serif; }
  #root { min-height: 100vh; }
  h1, h2, h3 { font-family: 'Fraunces', serif; }
  p, li { line-height: var(--lh-body); font-size: var(--fs-body); overflow-wrap: anywhere; }
  .btn { min-height: 48px; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: var(--fs-sm); font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #d9a441, #f0c169); color: #15120f; border: none; }
  .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid #8a7a62; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  :focus-visible { outline: 3px solid #f0c169; outline-offset: 2px; }
  input[type=range] { width: 100%; height: 32px; accent-color: #d9a441; }
  .sim-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 16px; align-items: start; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 10px; }
  @media (max-width: 900px) { .sim-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const colors = {
  bg: '#15120f', bgCard: '#1e1a15', bgLight: '#29231d',
  accent: '#d9a441', accentAlt: '#f0c169',
  text: '#f4eee3', textDim: '#d2c8b8', textMuted: '#a89a83',
  border: '#3c332a',
  success: '#6fae5c', danger: '#e0563a', warn: '#d9a441', info: '#4e93b8', purple: '#a879c4'
};

/* ---------- Il neurone giocattolo: tre ingressi, tre pesi, una soglia, regola del percettrone. ---------- */

const MAX_GIORNI = 20;

// Pratiche inventate. La risposta giusta (ok) segue una regola semplice: servono
// accompagnatori, costo nel tetto e domanda presentata con un buon anticipo.
const PRATICHE = [
  { nome: 'Museo della tecnica', acc: 1, costo: 1, giorni: 18, ok: 1 },
  { nome: 'Azienda alimentare', acc: 1, costo: 0, giorni: 15, ok: 0 },
  { nome: 'Teatro in città', acc: 1, costo: 1, giorni: 12, ok: 1 },
  { nome: 'Biblioteca comunale', acc: 1, costo: 1, giorni: 3, ok: 0 },
  { nome: 'Mostra e laboratorio', acc: 0, costo: 1, giorni: 20, ok: 0 },
  { nome: 'Parco naturale', acc: 1, costo: 1, giorni: 16, ok: 1 },
  { nome: 'Cinema al mattino', acc: 0, costo: 0, giorni: 10, ok: 0 },
  { nome: 'Centro di ricerca', acc: 1, costo: 1, giorni: 8, ok: 1 },
  { nome: 'Giornata in montagna', acc: 1, costo: 0, giorni: 2, ok: 0 },
  { nome: 'Fattoria didattica', acc: 1, costo: 1, giorni: 1, ok: 0 },
];

const INGRESSI = [
  { key: 'acc', label: 'Accompagnatori sufficienti', short: 'accompagnatori' },
  { key: 'costo', label: 'Costo entro il tetto', short: 'costo' },
  { key: 'anticipo', label: 'Giorni di anticipo', short: 'anticipo' },
];

const LR = 0.2;
const START = { w: [0.5, 0.5, 0.5], soglia: 1.5 };

const r2 = (v) => Math.round(v * 100) / 100;
const fmt = (v) => r2(v).toFixed(2).replace('.', ',');
const inputs = (p) => [p.acc, p.costo, Math.min(p.giorni / MAX_GIORNI, 1)];

function evalPratica(p, w, soglia) {
  const x = inputs(p);
  const somma = r2(x[0] * w[0] + x[1] * w[1] + x[2] * w[2]);
  const dice = somma >= r2(soglia) ? 1 : 0;
  return { x, somma, dice, errore: dice !== p.ok };
}

function Slider({ id, label, value, min, max, step, onChange, color }) {
  return (
    <div style={{ marginBottom: '10px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', gap: '8px', alignItems: 'baseline' }}>
        <label htmlFor={id} style={{ color: colors.text, fontWeight: 600, fontSize: 'var(--fs-sm)' }}>{label}</label>
        <span style={{ fontFamily: "'IBM Plex Mono', monospace", color, fontWeight: 600, fontSize: 'var(--fs-sm)' }}>{fmt(value)}</span>
      </div>
      <input id={id} type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(parseFloat(e.target.value))} />
    </div>
  );
}

function Neurone() {
  const [w, setW] = useState(START.w);
  const [soglia, setSoglia] = useState(START.soglia);
  const [cursore, setCursore] = useState(0);
  const [passi, setPassi] = useState(0);
  const [ultimo, setUltimo] = useState(null);

  const righe = PRATICHE.map((p) => evalPratica(p, w, soglia));
  const errori = righe.filter((r) => r.errore).length;
  const totale = PRATICHE.length;

  // Un passo = si prende la prima pratica sbagliata a partire dal cursore e si corregge.
  const unPasso = (wIn, sIn, curIn) => {
    const ev = PRATICHE.map((p) => evalPratica(p, wIn, sIn));
    let idx = -1;
    for (let k = 0; k < totale; k++) {
      const i = (curIn + k) % totale;
      if (ev[i].errore) { idx = i; break; }
    }
    if (idx < 0) return null;
    const p = PRATICHE[idx];
    const e = p.ok - ev[idx].dice; // +1: doveva dire sì, -1: doveva dire no
    const x = ev[idx].x;
    const nw = wIn.map((v, i) => r2(v + LR * e * x[i]));
    const ns = r2(sIn - LR * e);
    const cambi = INGRESSI.map((g, i) => ({ nome: g.short, da: wIn[i], a: nw[i], attivo: x[i] > 0 }))
      .filter((c) => c.a !== c.da);
    return { nw, ns, cur: (idx + 1) % totale, info: { pratica: p.nome, giusta: p.ok, dava: ev[idx].dice, cambi, sDa: sIn, sA: ns } };
  };

  const addestra = (n) => {
    let cw = w, cs = soglia, cc = cursore, info = null, fatti = 0;
    for (let k = 0; k < n; k++) {
      const res = unPasso(cw, cs, cc);
      if (!res) break;
      cw = res.nw; cs = res.ns; cc = res.cur; info = res.info; fatti++;
    }
    if (fatti > 0) {
      setW(cw); setSoglia(cs); setCursore(cc); setPassi((p) => p + fatti);
      setUltimo({ ...info, fatti });
    }
  };

  const ricomincia = () => {
    setW(START.w); setSoglia(START.soglia); setCursore(0); setPassi(0); setUltimo(null);
  };

  const setPeso = (i) => (v) => { const nw = w.slice(); nw[i] = v; setW(nw); setUltimo(null); };
  const sino = (v) => (v ? 'SÌ' : 'NO');

  return (
    <div className="sim-grid">
      <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '14px' }}>
        <h2 style={{ color: colors.info, fontSize: 'var(--fs-body)', marginBottom: '10px' }}>Le manopole</h2>
        <p style={{ color: colors.textDim, fontSize: 'var(--fs-sm)', marginBottom: '12px' }}>
          Ogni peso dice quanto conta un ingresso. La soglia dice quanto deve valere la somma per rispondere SÌ.
        </p>
        <Slider id="peso-acc" label="Peso: accompagnatori" value={w[0]} min={-3} max={3} step={0.05} onChange={setPeso(0)} color={colors.accent} />
        <Slider id="peso-costo" label="Peso: costo entro il tetto" value={w[1]} min={-3} max={3} step={0.05} onChange={setPeso(1)} color={colors.accent} />
        <Slider id="peso-anticipo" label="Peso: giorni di anticipo" value={w[2]} min={-3} max={3} step={0.05} onChange={setPeso(2)} color={colors.accent} />
        <Slider id="soglia" label="Soglia" value={soglia} min={-1} max={5} step={0.05} onChange={(v) => { setSoglia(v); setUltimo(null); }} color={colors.purple} />

        <div style={{ background: errori === 0 ? colors.success + '20' : colors.bgLight, border: `1px solid ${errori === 0 ? colors.success : colors.border}`, borderRadius: '8px', padding: '10px 12px', margin: '14px 0' }}>
          <div style={{ fontSize: 'var(--fs-sm)', color: colors.textMuted }}>Errori del neurone</div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 'var(--fs-h2)', fontWeight: 600, color: errori === 0 ? colors.success : colors.danger }}>
            {errori} su {totale}
          </div>
          <div style={{ fontSize: 'var(--fs-sm)', color: colors.textDim }}>
            {errori === 0 ? 'Obiettivo raggiunto: zero errori.' : 'Obiettivo: arrivare a zero errori.'}
          </div>
          <div style={{ fontSize: 'var(--fs-xs)', color: colors.textMuted, marginTop: '4px' }}>Passi di addestramento: {passi}</div>
        </div>

        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px' }}>
          <button className="btn btn-primary" onClick={() => addestra(1)} disabled={errori === 0}>Addestra un passo</button>
          <button className="btn btn-secondary" onClick={() => addestra(10)} disabled={errori === 0}>Addestra 10 passi</button>
          <button className="btn btn-secondary" onClick={ricomincia}>↺ Ricomincia</button>
        </div>

        <div aria-live="polite" style={{ marginTop: '14px' }}>
          {ultimo && (
            <div style={{ background: colors.bgLight, borderLeft: `4px solid ${colors.info}`, borderRadius: '0 8px 8px 0', padding: '10px 12px', fontSize: 'var(--fs-sm)', color: colors.textDim }}>
              <strong style={{ color: colors.text }}>Cosa è cambiato{ultimo.fatti > 1 ? ` (ultimo di ${ultimo.fatti} passi)` : ''}.</strong>{' '}
              Sulla pratica «{ultimo.pratica}» il neurone diceva {sino(ultimo.dava)}, ma la risposta giusta è {sino(ultimo.giusta)}.{' '}
              {ultimo.giusta ? 'Quindi i pesi degli ingressi accesi salgono e la soglia scende.' : 'Quindi i pesi degli ingressi accesi scendono e la soglia sale.'}
              <ul style={{ margin: '6px 0 0 20px' }}>
                {ultimo.cambi.map((c, i) => (
                  <li key={i} style={{ fontSize: 'var(--fs-sm)' }}>peso {c.nome}: {fmt(c.da)} → {fmt(c.a)}</li>
                ))}
                <li style={{ fontSize: 'var(--fs-sm)' }}>soglia: {fmt(ultimo.sDa)} → {fmt(ultimo.sA)}</li>
              </ul>
            </div>
          )}
        </div>
      </div>

      <div>
        <h2 style={{ color: colors.info, fontSize: 'var(--fs-body)', marginBottom: '8px' }}>Le dieci pratiche</h2>
        <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)', marginBottom: '10px' }}>
          Per ogni pratica: gli ingressi (1 = sì, 0 = no; i giorni di anticipo diventano un numero tra 0 e 1, dove 1 vuol dire 20 giorni o più), la somma pesata, la risposta del neurone e quella giusta.
        </p>
        <div className="cards">
          {PRATICHE.map((p, i) => {
            const r = righe[i];
            const bordo = r.errore ? colors.danger : colors.success;
            return (
              <div key={p.nome} style={{ background: colors.bgCard, border: `2px solid ${bordo}`, borderRadius: '10px', padding: '10px 12px', minWidth: 0 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: '8px', alignItems: 'flex-start' }}>
                  <strong style={{ color: colors.text, fontSize: 'var(--fs-sm)' }}>{p.nome}</strong>
                  <span style={{ color: bordo, fontWeight: 800, fontSize: 'var(--fs-sm)', whiteSpace: 'nowrap' }}>{r.errore ? '✗ Sbaglia' : '✓ Giusto'}</span>
                </div>
                <div style={{ fontSize: 'var(--fs-xs)', color: colors.textDim, marginTop: '4px' }}>
                  Accompagnatori sufficienti: <strong>{p.acc ? 'sì' : 'no'}</strong><br />
                  Costo entro il tetto: <strong>{p.costo ? 'sì' : 'no'}</strong><br />
                  Domanda con <strong>{p.giorni} giorni</strong> di anticipo ({fmt(r.x[2])})
                </div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 'var(--fs-xs)', color: colors.textMuted, marginTop: '6px', overflowWrap: 'anywhere' }}>
                  {fmt(w[0])}×{r.x[0]} + {fmt(w[1])}×{r.x[1]} + {fmt(w[2])}×{fmt(r.x[2])}
                </div>
                <div style={{ fontSize: 'var(--fs-sm)', color: colors.text, marginTop: '4px' }}>
                  Somma <strong style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmt(r.somma)}</strong> {r.somma >= r2(soglia) ? '≥' : '<'} soglia {fmt(soglia)}
                </div>
                <div style={{ display: 'flex', justifyContent: 'space-between', gap: '8px', marginTop: '6px', fontSize: 'var(--fs-sm)' }}>
                  <span style={{ color: colors.textDim }}>Neurone: <strong style={{ color: colors.accent }}>{sino(r.dice)}</strong></span>
                  <span style={{ color: colors.textDim }}>Giusta: <strong style={{ color: colors.text }}>{sino(p.ok)}</strong></span>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function App() {
  // Scala per schermi grandi (PC, proiettore): sotto 1366x768 e su mobile resta 1.
  const calcZoom = () => (window.innerWidth <= 900 ? 1 : Math.min(2.4, Math.max(1, Math.min(window.innerWidth / 1366, window.innerHeight / 768))));
  const [zoom, setZoom] = useState(calcZoom);
  useEffect(() => {
    const onResize = () => setZoom(calcZoom());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return (
    <div style={{ minHeight: '100vh', padding: '24px 20px 60px' }}>
      <div style={{ maxWidth: '1100px', margin: '0 auto', zoom }}>
        <a href="slide.html" style={{ color: colors.textMuted, textDecoration: 'none', fontSize: 'var(--fs-sm)' }}>← Torna alle slide</a>

        <h1 style={{ color: colors.accent, fontSize: 'var(--fs-h2)', marginTop: '18px', marginBottom: '14px' }}>
          Il neurone giocattolo
        </h1>

        <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderLeft: `5px solid ${colors.warn}`, borderRadius: '0 8px 8px 0', padding: '18px 22px', marginBottom: '20px' }}>
          <p style={{ color: colors.textDim, margin: '0 0 10px' }}>
            <strong style={{ color: colors.text }}>Cosa fare.</strong> Un neurone decide se un'uscita didattica si può approvare. Muovete i cursori dei pesi e della soglia fino ad arrivare a zero errori. Poi premete «Ricomincia» e fate fare il lavoro al neurone con «Addestra un passo».
          </p>
          <p style={{ color: colors.textDim, margin: 0 }}>
            Durata indicativa: 15 minuti. I dati sono inventati.
          </p>
        </div>

        <Neurone />

        <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '8px', padding: '16px 20px', marginTop: '24px' }}>
          <h2 style={{ color: colors.info, fontSize: 'var(--fs-body)', marginBottom: '8px' }}>Come impara</h2>
          <p style={{ color: colors.textDim }}>
            Il neurone guarda una pratica sbagliata. Se doveva dire SÌ, alza i pesi degli ingressi accesi e abbassa la soglia. Se doveva dire NO, fa il contrario. Poi passa alla pratica sbagliata successiva. Nessuno gli spiega la regola: la trova correggendo gli errori.
          </p>
          <p style={{ color: colors.textDim, marginTop: '10px' }}>
            Una rete vera segue la stessa idea, con un metodo di correzione più raffinato e con milioni o miliardi di manopole, regolate su moltissimi esempi.
          </p>
        </div>

        <div style={{ background: colors.success + '15', border: `1px solid ${colors.success}60`, borderRadius: '8px', padding: '16px 20px', marginTop: '16px' }}>
          <h2 style={{ color: colors.success, fontSize: 'var(--fs-body)', marginBottom: '8px' }}>Cosa abbiamo visto</h2>
          <p style={{ color: colors.textDim }}>
            Un neurone è una somma pesata seguita da una soglia. I pesi sono le manopole. Addestrare vuol dire regolarle un po' alla volta, guardando gli errori. Nessuno scrive le regole a mano.
          </p>
        </div>

        <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)', marginTop: '24px' }}>
          Dati inventati per l'esercitazione: nessuna pratica, uscita o persona reale della scuola.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
