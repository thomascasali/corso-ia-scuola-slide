<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Token e parole vicine — Lezione 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --bg: #15120f;
    --bg-card: #1e1a15;
    --bg-light: #29231d;
    --border: #3c332a;
    --text: #f4eee3;
    --text-dim: #d2c8b8;
    --text-muted: #a89a83;
    --success: #6fae5c;
    --danger: #e0563a;
    --warn: #d9a441;
    --info: #4e93b8;
    --purple: #a879c4;
    --fs-xs: clamp(14px, 0.7vw + 11px, 16px);
    --fs-sm: clamp(16px, 0.85vw + 12px, 18px);
    --fs-body: clamp(18px, 1vw + 13px, 21px);
    --fs-h2: clamp(26px, 2vw + 16px, 36px);
    --lh-body: 1.55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { background: var(--bg); color: var(--text); font-family: 'Public Sans', sans-serif; }
  #root { min-height: 100vh; }
  h1, h2, h3 { font-family: 'Fraunces', serif; }
  p, li { line-height: var(--lh-body); font-size: var(--fs-body); overflow-wrap: anywhere; }
  .btn { min-height: 48px; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: var(--fs-sm); font-family: inherit; text-align: left; }
  .btn-primary { background: linear-gradient(135deg, #d9a441, #f0c169); color: #15120f; border: none; }
  .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid #8a7a62; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  :focus-visible { outline: 3px solid #f0c169; outline-offset: 2px; }
  textarea { width: 100%; min-height: 96px; background: var(--bg); color: var(--text); border: 1px solid #8a7a62; border-radius: 8px; padding: 10px 12px; font-family: inherit; font-size: var(--fs-body); resize: vertical; }
  .tok { display: inline-block; padding: 4px 6px; margin: 3px 2px; border-radius: 6px; font-family: 'IBM Plex Mono', monospace; font-size: var(--fs-sm); color: var(--text); white-space: pre; border-bottom: 3px solid; }
  .map-wrap { max-width: 520px; margin: 0 auto; }
  .map-wrap svg { width: 100%; height: auto; display: block; }
  .word-g { cursor: pointer; }
  .word-g:focus-visible { outline: none; }
  .word-g:focus-visible rect { stroke: #f0c169; stroke-width: 3; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const colors = {
  bg: '#15120f', bgCard: '#1e1a15', bgLight: '#29231d',
  accent: '#d9a441', accentAlt: '#f0c169',
  text: '#f4eee3', textDim: '#d2c8b8', textMuted: '#a89a83',
  border: '#3c332a',
  success: '#6fae5c', danger: '#e0563a', warn: '#d9a441', info: '#4e93b8', purple: '#a879c4'
};

/* ---------- PARTE A: tokenizzatore SEMPLIFICATO (imitazione didattica) ---------- */

// Parole comuni: restano intere (un solo token).
const WHOLE = new Set(('il lo la l i gli le un uno una di del dello della dei degli delle a al alla ai alle da dal in nel nella con su per tra fra e ed o ma che non è sono ha hanno si ci mi vi ti ' +
  'questo questa oggi domani ieri scuola classe classi docente docenti studente studenti lezione lezioni riunione consiglio verifica compito voto voti gita uscita viaggio orario ' +
  'aula mattina pomeriggio genitori famiglie matematica italiano storia lunedì martedì mercoledì giovedì venerdì sabato ore ora alle consegnano consegna approva ' +
  'prova vero tutti anno ottobre novembre dicembre').split(' '));

// Pezzi frequenti per spezzare le parole rare (si cerca sempre il pezzo più lungo possibile).
const PIECES = ('inter disci plin are ri pro gram ma zione rendi conta auto valu ta video confe ren za men to sociale ' +
  'ap provazione appro va re ione ico ica ità mente pre sen te sta bi li lità co mu ni ca zio ne pia no ' +
  'for ma tivo tiva ti ni nuo ra rin vi ato ata ito ita dell').split(' ').filter(Boolean);
PIECES.sort((a, b) => b.length - a.length);

function spezzaParola(w) {
  const low = w.toLowerCase();
  if (WHOLE.has(low)) return [w];
  const out = [];
  let i = 0;
  while (i < low.length) {
    let trovato = null;
    for (const p of PIECES) {
      if (p.length > 1 && low.startsWith(p, i)) { trovato = p; break; }
    }
    const len = trovato ? trovato.length : 1; // se nessun pezzo va bene: una lettera sola
    out.push(w.slice(i, i + len));
    i += len;
  }
  return out;
}

function tokenizza(testo) {
  const re = /\s*[\p{L}\p{N}]+|\s*[^\s\p{L}\p{N}]/gu;
  const out = [];
  const parole = [];
  let m;
  while ((m = re.exec(testo)) !== null) {
    const raw = m[0];
    const spazio = /^\s/.test(raw);
    const core = raw.trim();
    let pezzi;
    if (/^\p{N}+$/u.test(core)) pezzi = core.split('');          // le cifre: una per token
    else if (/^[\p{L}]+$/u.test(core)) pezzi = spezzaParola(core);
    else pezzi = [core];
    parole.push({ core, n: pezzi.length });
    pezzi.forEach((p, k) => out.push({ testo: p, spazio: spazio && k === 0 }));
  }
  return { tokens: out, parole };
}

const FRASI = [
  "Il consiglio di classe approva la gita di martedì.",
  "La riprogrammazione dell'orario interdisciplinare è rinviata.",
  "Ore 8:30, aula 12: la verifica di matematica.",
  "Autovalutazione e rendicontazione sociale della scuola.",
];

const PALETTE = ['#d9a441', '#4e93b8', '#6fae5c', '#a879c4', '#e0563a', '#c8c0a8'];

function ParteA() {
  const [testo, setTesto] = useState(FRASI[0]);
  const { tokens, parole } = tokenizza(testo);
  const nParole = parole.filter((p) => /[\p{L}\p{N}]/u.test(p.core)).length;

  return (
    <section style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '16px 18px', marginBottom: '28px' }}>
      <h2 style={{ color: colors.info, fontSize: 'var(--fs-h2)', marginBottom: '8px' }}>Parte A. Il testo diventa token</h2>
      <p style={{ color: colors.textDim, marginBottom: '12px' }}>
        Il modello non legge lettere né parole: legge pezzi chiamati <strong style={{ color: colors.text }}>token</strong>. Scegliete una frase o scrivetene una vostra e guardate come viene spezzata.
      </p>
      <div style={{ background: colors.warn + '18', border: `1px solid ${colors.warn}`, borderRadius: '8px', padding: '10px 14px', marginBottom: '14px' }}>
        <p style={{ color: colors.textDim, fontSize: 'var(--fs-sm)' }}>
          <strong style={{ color: colors.text }}>Attenzione: è un'imitazione semplificata.</strong> Qui il vocabolario ha pochi pezzi, scritti a mano. I tokenizzatori veri usano vocabolari di decine di migliaia di pezzi e spezzano in modo diverso.
        </p>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '12px' }}>
        {FRASI.map((f, i) => (
          <button key={i} className="btn btn-secondary" onClick={() => setTesto(f)}>Frase {i + 1}</button>
        ))}
      </div>

      <label htmlFor="testo" style={{ display: 'block', color: colors.text, fontWeight: 600, marginBottom: '6px', fontSize: 'var(--fs-sm)' }}>Il testo da spezzare</label>
      <textarea id="testo" value={testo} onChange={(e) => setTesto(e.target.value)} />

      <div aria-live="polite" style={{ margin: '14px 0 6px', padding: '10px 12px', background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: '8px', minHeight: '56px' }}>
        {tokens.length === 0 && <span style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)' }}>Scrivete qualcosa qui sopra.</span>}
        {tokens.map((t, i) => {
          const c = PALETTE[i % PALETTE.length];
          return <span key={i} className="tok" style={{ background: c + '30', borderColor: c }}>{t.spazio ? '▁' : ''}{t.testo}</span>;
        })}
      </div>
      <p style={{ color: colors.textMuted, fontSize: 'var(--fs-xs)', marginBottom: '10px' }}>Il segno ▁ indica uno spazio prima del pezzo: nei modelli veri lo spazio fa parte del token.</p>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px' }}>
        <div style={{ background: colors.bgLight, borderRadius: '8px', padding: '8px 14px' }}>
          <div style={{ fontSize: 'var(--fs-xs)', color: colors.textMuted }}>Parole</div>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 'var(--fs-h2)', color: colors.text }}>{nParole}</div>
        </div>
        <div style={{ background: colors.bgLight, borderRadius: '8px', padding: '8px 14px' }}>
          <div style={{ fontSize: 'var(--fs-xs)', color: colors.textMuted }}>Token</div>
          <div data-testid="n-token" style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 'var(--fs-h2)', color: colors.accent }}>{tokens.length}</div>
        </div>
        <div style={{ background: colors.bgLight, borderRadius: '8px', padding: '8px 14px', flex: '1 1 220px' }}>
          <div style={{ fontSize: 'var(--fs-xs)', color: colors.textMuted }}>Parole spezzate in più pezzi</div>
          <div style={{ fontSize: 'var(--fs-sm)', color: colors.textDim }}>
            {parole.filter((p) => p.n > 1 && /[\p{L}]/u.test(p.core)).map((p) => p.core).join(', ') || 'nessuna'}
          </div>
        </div>
      </div>
      <p style={{ color: colors.textDim, fontSize: 'var(--fs-sm)', marginTop: '12px' }}>
        Le parole comuni restano intere. Le parole rare e i numeri si spezzano. Anche i costi si misurano in token, e il modello ha un limite di token che può leggere in una volta.
      </p>
    </section>
  );
}

/* ---------- PARTE B: parole vicine ---------- */

// Posizioni scelte a mano: le parole con significato simile stanno vicine.
const MAPPA = [
  // persone adulte
  { w: 'docente', x: 60, y: 32, g: 'adulti' }, { w: 'insegnante', x: 145, y: 62, g: 'adulti' },
  { w: 'professore', x: 62, y: 92, g: 'adulti' }, { w: 'dirigente', x: 145, y: 122, g: 'adulti' },
  // ragazzi
  { w: 'studente', x: 262, y: 32, g: 'ragazzi' }, { w: 'alunno', x: 340, y: 70, g: 'ragazzi' }, { w: 'allievo', x: 265, y: 108, g: 'ragazzi' },
  // prove
  { w: 'verifica', x: 58, y: 196, g: 'prove' }, { w: 'compito', x: 150, y: 222, g: 'prove' },
  { w: 'interrogazione', x: 80, y: 252, g: 'prove' }, { w: 'esame', x: 150, y: 282, g: 'prove' },
  // voti
  { w: 'voto', x: 265, y: 196, g: 'voti' }, { w: 'pagella', x: 340, y: 228, g: 'voti' }, { w: 'valutazione', x: 270, y: 262, g: 'voti' },
  // uscite
  { w: 'gita', x: 50, y: 352, g: 'uscite' }, { w: 'uscita', x: 140, y: 378, g: 'uscite' },
  { w: 'viaggio', x: 55, y: 410, g: 'uscite' }, { w: 'visita', x: 140, y: 440, g: 'uscite' },
  // tempo
  { w: 'orario', x: 280, y: 352, g: 'tempo' }, { w: 'campanella', x: 340, y: 386, g: 'tempo' },
  { w: 'ora', x: 270, y: 416, g: 'tempo' }, { w: 'intervallo', x: 340, y: 446, g: 'tempo' },
  // luoghi
  { w: 'aula', x: 130, y: 540, g: 'luoghi' }, { w: 'laboratorio', x: 250, y: 560, g: 'luoghi' },
  { w: 'palestra', x: 135, y: 590, g: 'luoghi' }, { w: 'biblioteca', x: 250, y: 616, g: 'luoghi' },
];

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const piuVicina = (t) => MAPPA.filter((m) => m.w !== t.w).sort((a, b) => dist(t, a) - dist(t, b))[0];
const BOXW = (w) => w.length * 8.6 + 20;

function nuovaPartita() {
  const arr = MAPPA.slice();
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr.slice(0, 6);
}

function ParteB() {
  const [round, setRound] = useState(nuovaPartita);
  const [i, setI] = useState(0);
  const [scelta, setScelta] = useState(null);
  const [punti, setPunti] = useState(0);

  const finita = i >= round.length;
  const target = finita ? null : round[i];
  const giusta = target ? piuVicina(target) : null;
  const risposto = scelta !== null;

  const clic = (m) => {
    if (finita || risposto || m.w === target.w) return;
    setScelta(m);
    if (m.w === giusta.w) setPunti((p) => p + 1);
  };
  const avanti = () => { setScelta(null); setI((n) => n + 1); };
  const ricomincia = () => { setRound(nuovaPartita()); setI(0); setScelta(null); setPunti(0); };

  const stile = (m) => {
    let fill = colors.bgLight, stroke = '#8a7a62', txt = colors.text;
    if (target && m.w === target.w) { fill = colors.accent; stroke = colors.accentAlt; txt = colors.bg; }
    else if (risposto && m.w === giusta.w) { fill = colors.success + '55'; stroke = colors.success; }
    else if (risposto && scelta.w === m.w) { fill = colors.danger + '55'; stroke = colors.danger; }
    return { fill, stroke, txt };
  };

  return (
    <section style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '16px 18px', marginBottom: '24px' }}>
      <h2 style={{ color: colors.info, fontSize: 'var(--fs-h2)', marginBottom: '8px' }}>Parte B. Parole vicine</h2>
      <p style={{ color: colors.textDim, marginBottom: '12px' }}>
        Il modello dà a ogni parola un posto su una mappa: le parole usate in frasi simili finiscono vicine. Qui la mappa ha solo due numeri per parola, per poterla disegnare, e le posizioni le abbiamo scelte a mano. Un modello vero ne usa centinaia o migliaia.
      </p>
      <div style={{ background: colors.bgLight, borderRadius: '8px', padding: '10px 14px', marginBottom: '12px' }}>
        <p style={{ color: colors.textDim, fontSize: 'var(--fs-sm)' }}>
          <strong style={{ color: colors.text }}>Gioco.</strong> Una parola è evidenziata in giallo. Cliccate la parola che le sta più vicina sulla mappa. Sono sei domande.
        </p>
      </div>

      <div aria-live="polite" style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', alignItems: 'center', justifyContent: 'space-between', marginBottom: '10px' }}>
        <div style={{ fontSize: 'var(--fs-body)', color: colors.text }}>
          {finita
            ? <strong data-testid="fine">Finito: {punti} su {round.length}.</strong>
            : <span>Domanda {i + 1} di {round.length}. Parola: <strong data-testid="target" style={{ color: colors.accent }}>{target.w}</strong></span>}
        </div>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: colors.textMuted, fontSize: 'var(--fs-sm)' }}>Punti: <span data-testid="punti" style={{ color: colors.accent }}>{punti}</span></div>
      </div>

      {risposto && (
        <div data-testid="esito" style={{ background: scelta.w === giusta.w ? colors.success + '20' : colors.danger + '20', border: `1px solid ${scelta.w === giusta.w ? colors.success : colors.danger}`, borderRadius: '8px', padding: '8px 12px', marginBottom: '10px', fontSize: 'var(--fs-sm)', color: colors.text }}>
          {scelta.w === giusta.w
            ? <span>Giusto: «{giusta.w}» è la più vicina a «{target.w}».</span>
            : <span>Non proprio: la più vicina a «{target.w}» è «{giusta.w}» (linea verde).</span>}
        </div>
      )}

      <div className="map-wrap">
        <svg viewBox="0 0 400 650" role="group" aria-label="Mappa delle parole">
          <rect x="0" y="0" width="400" height="650" rx="10" fill={colors.bg} stroke={colors.border} />
          {risposto && (
            <g>
              <line x1={target.x} y1={target.y} x2={giusta.x} y2={giusta.y} stroke={colors.success} strokeWidth="3" strokeDasharray="6 4" />
              {scelta.w !== giusta.w && <line x1={target.x} y1={target.y} x2={scelta.x} y2={scelta.y} stroke={colors.danger} strokeWidth="3" strokeDasharray="2 4" />}
            </g>
          )}
          {MAPPA.map((m) => {
            const s = stile(m);
            const bw = BOXW(m.w);
            return (
              <g key={m.w} className="word-g" data-word={m.w} data-x={m.x} data-y={m.y}
                 data-target={target && m.w === target.w ? '1' : undefined}
                 role="button" tabIndex={0} aria-label={m.w}
                 onClick={() => clic(m)}
                 onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clic(m); } }}>
                <rect x={m.x - bw / 2} y={m.y - 14} width={bw} height="28" rx="7" fill={s.fill} stroke={s.stroke} strokeWidth="1.5" />
                <text x={m.x} y={m.y} textAnchor="middle" dominantBaseline="central" fontSize="15" fontWeight="600" fill={s.txt} style={{ fontFamily: "'Public Sans', sans-serif" }}>{m.w}</text>
              </g>
            );
          })}
        </svg>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', marginTop: '14px' }}>
        {risposto && !finita && <button className="btn btn-primary" onClick={avanti}>{i + 1 >= round.length ? 'Vedi il risultato →' : 'Prossima parola →'}</button>}
        <button className="btn btn-secondary" onClick={ricomincia}>↺ Nuova partita</button>
      </div>
    </section>
  );
}

function App() {
  return (
    <div style={{ minHeight: '100vh', padding: '24px 20px 60px' }}>
      <div style={{ maxWidth: '1100px', margin: '0 auto' }}>
        <a href="slide.html" style={{ color: colors.textMuted, textDecoration: 'none', fontSize: 'var(--fs-sm)' }}>← Torna alle slide</a>

        <h1 style={{ color: colors.accent, fontSize: 'var(--fs-h2)', marginTop: '18px', marginBottom: '14px' }}>
          Token e parole vicine
        </h1>

        <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderLeft: `5px solid ${colors.warn}`, borderRadius: '0 8px 8px 0', padding: '18px 22px', marginBottom: '20px' }}>
          <p style={{ color: colors.textDim, margin: '0 0 10px' }}>
            <strong style={{ color: colors.text }}>Cosa fare.</strong> Nella parte A scrivete frasi di scuola e guardate come diventano token. Nella parte B giocate a trovare la parola più vicina per significato.
          </p>
          <p style={{ color: colors.textDim, margin: 0 }}>Durata indicativa: 15 minuti.</p>
        </div>

        <ParteA />
        <ParteB />

        <div style={{ background: colors.success + '15', border: `1px solid ${colors.success}60`, borderRadius: '8px', padding: '16px 20px', marginTop: '8px' }}>
          <h2 style={{ color: colors.success, fontSize: 'var(--fs-body)', marginBottom: '8px' }}>Cosa abbiamo visto</h2>
          <p style={{ color: colors.textDim }}>
            Prima di fare qualunque calcolo, il modello trasforma il testo in token e ogni token in numeri. Le parole con significato simile hanno numeri simili, quindi stanno vicine su una mappa. Il modello non conosce le parole come le conosciamo noi: lavora con questi numeri.
          </p>
        </div>

        <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)', marginTop: '24px' }}>
          Imitazione semplificata a scopo didattico: frasi e mappa inventate.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
