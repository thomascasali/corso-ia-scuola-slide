<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La prossima parola — Lezione 0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --bg: #15120f;
    --bg-card: #1e1a15;
    --bg-light: #29231d;
    --border: #3c332a;
    --text: #f4eee3;
    --text-dim: #d2c8b8;
    --text-muted: #a89a83;
    --success: #6fae5c;
    --danger: #e0563a;
    --warn: #d9a441;
    --info: #4e93b8;
    --purple: #a879c4;
    --fs-xs: clamp(14px, 0.7vw + 11px, 16px);
    --fs-sm: clamp(16px, 0.85vw + 12px, 18px);
    --fs-body: clamp(18px, 1vw + 13px, 21px);
    --fs-h2: clamp(26px, 2vw + 16px, 36px);
    --lh-body: 1.55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { background: var(--bg); color: var(--text); font-family: 'Public Sans', sans-serif; }
  #root { min-height: 100vh; }
  h1, h2, h3 { font-family: 'Fraunces', serif; }
  p, li { line-height: var(--lh-body); font-size: var(--fs-body); overflow-wrap: anywhere; }
  .btn { min-height: 48px; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: var(--fs-sm); font-family: inherit; }
  .btn-primary { background: linear-gradient(135deg, #d9a441, #f0c169); color: #15120f; border: none; }
  .btn-secondary { background: transparent; color: var(--text-dim); border: 1px solid #8a7a62; }
  .btn:disabled { opacity: 0.55; cursor: default; }
  :focus-visible { outline: 3px solid #f0c169; outline-offset: 2px; }
  input[type=range] { width: 100%; height: 32px; accent-color: #d9a441; }
  .row { display: grid; grid-template-columns: minmax(90px, 160px) minmax(0, 1fr) 56px; gap: 10px; align-items: center; padding: 5px 0; }
  @media (max-width: 520px) { .row { grid-template-columns: minmax(80px, 110px) minmax(0, 1fr) 48px; gap: 6px; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const colors = {
  bg: '#15120f', bgCard: '#1e1a15', bgLight: '#29231d',
  accent: '#d9a441', accentAlt: '#f0c169',
  text: '#f4eee3', textDim: '#d2c8b8', textMuted: '#a89a83',
  border: '#3c332a',
  success: '#6fae5c', danger: '#e0563a', warn: '#d9a441', info: '#4e93b8', purple: '#a879c4'
};

/* ---------- La prossima parola: alberi piccoli scritti a mano.
   Ogni nodo è una lista di candidati [parola, peso, nodo successivo]; i pesi sono inventati
   e vengono normalizzati a somma 1. 'FINE' chiude la frase. ---------- */

const FINE = 'FINE';
const PUNTI_FINALI = [['.', 86, FINE], ['!', 6, FINE], ['…', 4, FINE], ['?', 4, FINE]];

const FRASI = [
  {
    id: 'consiglio',
    inizio: 'La riunione del consiglio di classe è fissata per',
    nodi: {
      a: [['martedì', 30, 'b'], ['lunedì', 22, 'b'], ['giovedì', 18, 'b'], ['mercoledì', 14, 'b'], ['venerdì', 10, 'b'], ['sabato', 6, 'b']],
      b: [['alle', 46, 'c'], ['mattina', 18, 'g'], ['pomeriggio', 16, 'g'], ['sera', 10, 'g'], ['mezzogiorno', 6, 'g']],
      c: [['15', 26, 'g'], ['14', 22, 'g'], ['16', 18, 'g'], ['17', 14, 'g'], ['13', 12, 'g'], ['18', 8, 'g']],
      g: [['.', 44, FINE], ['in', 20, 'h'], ['nella', 14, 'h2'], ['online', 10, 'k'], ['come', 12, 'm']],
      h: [['aula', 34, 'k'], ['presenza', 26, 'k'], ['videoconferenza', 16, 'k'], ['biblioteca', 10, 'k'], ['palestra', 8, 'k'], ['sala', 6, 'k']],
      h2: [['sala', 34, 'k'], ['biblioteca', 24, 'k'], ['palestra', 16, 'k'], ['classe', 14, 'k'], ['scuola', 12, 'k']],
      m: [['previsto', 44, 'k'], ['stabilito', 22, 'k'], ['concordato', 14, 'k'], ['deciso', 10, 'k'], ['indicato', 6, 'k'], ['annunciato', 4, 'k']],
      k: PUNTI_FINALI,
    },
  },
  {
    id: 'genitori',
    inizio: 'Gentili genitori, vi informo che domani le lezioni',
    nodi: {
      a: [['inizieranno', 30, 'b'], ['finiranno', 22, 'c'], ['termineranno', 18, 'c'], ['riprenderanno', 12, 'b'], ['saranno', 12, 'd'], ['cominceranno', 6, 'b']],
      b: [['alle', 40, 'f1'], ['regolarmente', 22, 'k'], ['come', 14, 'm'], ['normalmente', 10, 'k'], ['puntuali', 8, 'k']],
      c: [['alle', 50, 'f2'], ['regolarmente', 20, 'k'], ['presto', 12, 'k'], ['come', 10, 'm'], ['puntuali', 8, 'k']],
      d: [['sospese', 34, 'k'], ['regolari', 24, 'k'], ['ridotte', 16, 'k'], ['recuperate', 14, 'k'], ['annullate', 12, 'k']],
      f1: [['8', 34, 'k'], ['9', 24, 'k'], ['10', 16, 'k'], ['14', 12, 'k'], ['15', 8, 'k'], ['11', 6, 'k']],
      f2: [['13', 30, 'k'], ['12', 28, 'k'], ['14', 18, 'k'], ['11', 10, 'k'], ['10', 8, 'k'], ['16', 6, 'k']],
      m: [['previsto', 44, 'k'], ['sempre', 22, 'k'], ['programmato', 14, 'k'], ['concordato', 10, 'k'], ['comunicato', 6, 'k']],
      k: PUNTI_FINALI,
    },
  },
  {
    id: 'recupero',
    inizio: 'Per iscriversi al corso di recupero bisogna compilare il',
    nodi: {
      a: [['modulo', 46, 'b'], ['questionario', 16, 'b'], ['foglio', 12, 'b'], ['registro', 10, 'b'], ['documento', 10, 'b'], ['modello', 6, 'b']],
      b: [['online', 32, 'k'], ['entro', 30, 'c'], ['sul', 22, 's'], ['subito', 10, 'k'], ['oggi', 6, 'k']],
      c: [['venerdì', 26, 'k'], ['lunedì', 20, 'k'], ['domani', 18, 'k'], ['oggi', 12, 'k'], ['giovedì', 12, 'k'], ['sabato', 6, 'k']],
      s: [['sito', 60, 'k'], ['portale', 20, 'k'], ['registro', 10, 'k'], ['retro', 5, 'k'], ['computer', 3, 'k']],
      k: PUNTI_FINALI,
    },
  },
];

/* softmax con temperatura sui logit (logit = ln della probabilità di partenza) */
function probsT(opzioni, T) {
  const tot = opzioni.reduce((s, o) => s + o[1], 0);
  const base = opzioni.map((o) => o[1] / tot);
  if (T <= 0.05) { // temperatura minima: sceglie sempre la più probabile
    const imax = base.indexOf(Math.max(...base));
    return { base, p: base.map((_, i) => (i === imax ? 1 : 0)) };
  }
  const z = base.map((p) => Math.log(p) / T);
  const m = Math.max(...z);
  const e = z.map((v) => Math.exp(v - m));
  const s = e.reduce((a, b) => a + b, 0);
  return { base, p: e.map((v) => v / s) };
}

function pesca(p) {
  const r = Math.random();
  let c = 0;
  for (let i = 0; i < p.length; i++) { c += p[i]; if (r < c) return i; }
  return p.length - 1;
}

const unisci = (inizio, parole) => parole.reduce((s, w) => s + (/^[.!…;,:?]$/.test(w) ? w : ' ' + w), inizio);
const pct = (v) => (v > 0 && v < 0.005 ? '<1%' : Math.round(v * 100) + '%');
const etichettaT = (T) => (T <= 0.05 ? 'minima: sceglie sempre la più probabile' : T <= 0.5 ? 'bassa: prudente' : T <= 1.2 ? 'media' : 'alta: creativa');

function Simulazione() {
  const [fi, setFi] = useState(0);
  const [parole, setParole] = useState([]);
  const [nodo, setNodo] = useState('a');
  const [T, setT] = useState(1);
  const [ultima, setUltima] = useState(null);
  const [storia, setStoria] = useState([]);

  const frase = FRASI[fi];
  const finita = nodo === FINE;
  const opz = finita ? null : frase.nodi[nodo];
  const calc = opz ? probsT(opz, T) : null;

  const cambiaFrase = (i) => { setFi(i); setParole([]); setNodo('a'); setUltima(null); };
  const ricomincia = () => { setParole([]); setNodo('a'); setUltima(null); };

  const estrai = () => {
    if (finita) return;
    const i = pesca(calc.p);
    setParole((p) => [...p, opz[i][0]]);
    setNodo(opz[i][2]);
    setUltima({ parola: opz[i][0], p: calc.p[i], idx: i });
  };

  const rigenera = () => {
    let n = 'a', ws = [], guardia = 0;
    while (n !== FINE && guardia++ < 20) {
      const o = frase.nodi[n];
      const c = probsT(o, T);
      const i = pesca(c.p);
      ws.push(o[i][0]); n = o[i][2];
    }
    setParole(ws); setNodo(FINE); setUltima(null);
    setStoria((s) => [{ testo: unisci(frase.inizio, ws), T }, ...s].slice(0, 8));
  };

  return (
    <div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', marginBottom: '14px' }}>
        {FRASI.map((f, i) => (
          <button key={f.id} className="btn btn-secondary" aria-pressed={i === fi}
            style={i === fi ? { borderColor: colors.accent, color: colors.accent } : undefined}
            onClick={() => cambiaFrase(i)}>Partenza {i + 1}</button>
        ))}
      </div>

      <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '16px 18px', marginBottom: '16px' }}>
        <div style={{ fontSize: 'var(--fs-xs)', color: colors.textMuted, textTransform: 'uppercase', letterSpacing: '1px', fontFamily: "'IBM Plex Mono', monospace", marginBottom: '6px' }}>La frase finora</div>
        <p data-testid="frase" aria-live="polite" style={{ fontFamily: "'Fraunces', serif", color: colors.text, fontSize: 'var(--fs-h2)', lineHeight: 1.3 }}>
          {frase.inizio}
          {parole.map((w, i) => <span key={i} style={{ color: colors.accent }}>{/^[.!…;,:?]$/.test(w) ? '' : ' '}{w}</span>)}
          {!finita && <span style={{ color: colors.textMuted }}> …</span>}
        </p>
        {finita && <p style={{ color: colors.success, fontSize: 'var(--fs-sm)', marginTop: '6px' }}>Frase completa. Premete «Ricomincia» o «Rigenera» per riprovare.</p>}
      </div>

      <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '16px 18px', marginBottom: '16px' }}>
        <label htmlFor="temp" style={{ display: 'flex', justifyContent: 'space-between', gap: '8px', flexWrap: 'wrap', color: colors.text, fontWeight: 600, fontSize: 'var(--fs-sm)' }}>
          <span>Temperatura</span>
          <span data-testid="temp-label" style={{ color: colors.purple, fontFamily: "'IBM Plex Mono', monospace" }}>{T.toFixed(2).replace('.', ',')} · {etichettaT(T)}</span>
        </label>
        <input id="temp" type="range" min="0.05" max="2.5" step="0.05" value={T} onChange={(e) => setT(parseFloat(e.target.value))} />
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 'var(--fs-xs)', color: colors.textMuted }}>
          <span>bassa: sempre le più probabili</span><span>alta: scelte più varie</span>
        </div>
      </div>

      <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '16px 18px', marginBottom: '16px' }}>
        <h2 style={{ color: colors.info, fontSize: 'var(--fs-body)', marginBottom: '6px' }}>Le parole candidate</h2>
        {finita ? (
          <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)' }}>La frase è finita: non ci sono altri candidati.</p>
        ) : (
          <div>
            <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)', marginBottom: '6px' }}>
              Probabilità con questa temperatura. La riga sottile mostra la probabilità a temperatura 1.
            </p>
            {opz.map((o, i) => {
              return (
                <div className="row" key={o[0] + i} data-testid="cand">
                  <span style={{ color: colors.text, fontWeight: 600, fontSize: 'var(--fs-sm)', overflowWrap: 'anywhere' }}>{o[0]}</span>
                  <div style={{ position: 'relative', height: '22px', background: colors.bgLight, borderRadius: '5px' }}>
                    <div style={{ width: `${calc.p[i] * 100}%`, height: '100%', background: colors.accent, borderRadius: '5px', transition: 'width .25s' }} />
                    <div title="probabilità a temperatura 1" style={{ position: 'absolute', left: `${calc.base[i] * 100}%`, top: 0, bottom: 0, width: '3px', background: colors.info, marginLeft: '-1px' }} />
                  </div>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: colors.textDim, fontSize: 'var(--fs-sm)', textAlign: 'right' }}>{pct(calc.p[i])}</span>
                </div>
              );
            })}
            <p style={{ color: colors.textMuted, fontSize: 'var(--fs-xs)', marginTop: '6px' }}>Barra gialla: con questa temperatura. Segno azzurro: a temperatura 1.</p>
          </div>
        )}
        {ultima && (
          <p data-testid="ultima" aria-live="polite" style={{ color: colors.textDim, fontSize: 'var(--fs-sm)', marginTop: '10px' }}>
            Estratta: <strong style={{ color: colors.accent }}>{ultima.parola}</strong>, con probabilità {pct(ultima.p)}. Era una scelta a sorte: poteva uscire un'altra parola.
          </p>
        )}
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', marginTop: '14px' }}>
          <button className="btn btn-primary" onClick={estrai} disabled={finita}>Estrai la prossima parola</button>
          <button className="btn btn-secondary" onClick={rigenera}>Rigenera (frase intera)</button>
          <button className="btn btn-secondary" onClick={ricomincia}>↺ Ricomincia</button>
        </div>
      </div>

      <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '16px 18px' }}>
        <h2 style={{ color: colors.info, fontSize: 'var(--fs-body)', marginBottom: '6px' }}>Frasi ottenute con «Rigenera»</h2>
        {storia.length === 0
          ? <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)' }}>Premete «Rigenera» più volte: la partenza è sempre la stessa, le frasi no. Poi mettete la temperatura al minimo e riprovate.</p>
          : <ul style={{ listStyle: 'none' }}>
              {storia.map((s, i) => (
                <li key={i} data-testid="storia" style={{ fontSize: 'var(--fs-sm)', color: colors.textDim, padding: '6px 0', borderBottom: `1px solid ${colors.border}` }}>
                  {s.testo} <span style={{ color: colors.textMuted, fontFamily: "'IBM Plex Mono', monospace", fontSize: 'var(--fs-xs)' }}>(T {s.T.toFixed(2).replace('.', ',')})</span>
                </li>
              ))}
            </ul>}
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{ minHeight: '100vh', padding: '24px 20px 60px' }}>
      <div style={{ maxWidth: '900px', margin: '0 auto' }}>
        <a href="slide.html" style={{ color: colors.textMuted, textDecoration: 'none', fontSize: 'var(--fs-sm)' }}>← Torna alle slide</a>

        <h1 style={{ color: colors.accent, fontSize: 'var(--fs-h2)', marginTop: '18px', marginBottom: '14px' }}>
          La prossima parola
        </h1>

        <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderLeft: `5px solid ${colors.warn}`, borderRadius: '0 8px 8px 0', padding: '18px 22px', marginBottom: '20px' }}>
          <p style={{ color: colors.textDim, margin: '0 0 10px' }}>
            <strong style={{ color: colors.text }}>Cosa fare.</strong> Scegliete una partenza e premete «Estrai la prossima parola» più volte, finché la frase finisce. Poi muovete la temperatura e provate «Rigenera».
          </p>
          <p style={{ color: colors.textDim, margin: 0 }}>
            Durata indicativa: 15 minuti. Le probabilità sono inventate, ma plausibili.
          </p>
        </div>

        <Simulazione />

        <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '8px', padding: '16px 20px', marginTop: '24px' }}>
          <p style={{ color: colors.textDim }}>
            <strong style={{ color: colors.text }}>Come funziona un chatbot.</strong> Fa questo, parola dopo parola, con un vocabolario enorme: a ogni passo calcola le probabilità di decine di migliaia di candidati e ne pesca uno.
          </p>
        </div>

        <div style={{ background: colors.success + '15', border: `1px solid ${colors.success}60`, borderRadius: '8px', padding: '16px 20px', marginTop: '16px' }}>
          <h2 style={{ color: colors.success, fontSize: 'var(--fs-body)', marginBottom: '8px' }}>Cosa abbiamo visto</h2>
          <p style={{ color: colors.textDim }}>
            Un modello di linguaggio non ha una frase già pronta: a ogni passo assegna una probabilità alle parole possibili e ne sceglie una a sorte. Per questo la stessa domanda può dare risposte diverse. La temperatura decide quanto rischiare: bassa vuol dire quasi sempre la stessa risposta, alta vuol dire più varietà e più rischio di frasi strane.
          </p>
        </div>

        <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)', marginTop: '24px' }}>
          Alberi di parole scritti a mano a scopo didattico: non vengono da un modello vero.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
