<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulazione: un compito più complesso — Argomento 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root {
    --bg: #15120f;
    --bg-card: #1e1a15;
    --bg-light: #29231d;
    --border: #3c332a;
    --text: #f4eee3;
    --text-dim: #d2c8b8;
    --text-muted: #a89a83;
    --success: #6fae5c;
    --danger: #e0563a;
    --warn: #d9a441;
    --info: #4e93b8;
    --purple: #a879c4;
    --fs-xs: clamp(14px, 0.7vw + 11px, 16px);
    --fs-sm: clamp(16px, 0.85vw + 12px, 18px);
    --fs-body: clamp(18px, 1vw + 13px, 21px);
    --fs-h2: clamp(26px, 2vw + 16px, 36px);
    --lh-body: 1.55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Public Sans', sans-serif; }
  #root { min-height: 100vh; }
  h1, h2 { font-family: 'Fraunces', serif; }
  p, li { line-height: var(--lh-body); font-size: var(--fs-body); }
  .agent-sim-grid { grid-template-columns: minmax(0,1fr) minmax(0,1.2fr); }
  @media (max-width: 900px) {
    .agent-sim-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const colors = {
  bg: '#15120f', bgCard: '#1e1a15', bgLight: '#29231d',
  accent: '#d9a441', accentAlt: '#f0c169',
  text: '#f4eee3', textDim: '#d2c8b8', textMuted: '#a89a83',
  border: '#3c332a',
  success: '#6fae5c', danger: '#e0563a', warn: '#d9a441', info: '#4e93b8', purple: '#a879c4'
};

/* ---------- simulazione chatbot/agente, compito più complesso (uscite di dicembre).
   Stesso meccanismo della simulazione in slide.html, ma scenario diverso: la slide «La simulazione»
   resta con il suo scenario (uscite di novembre) e questo file non la condivide. ---------- */

const AGENT_TASK = "Controlla le pratiche delle uscite di dicembre rispetto al regolamento e prepara le bozze dei messaggi ai referenti delle pratiche con problemi.";

const AGENT_STEPS = [
  { action: "Fa un piano", detail: "Prima di muoversi, elenca cosa deve fare: leggere le pratiche, aprire del regolamento solo ciò che serve, fare i conti, confrontare, preparare le bozze, consegnare.", icon: "📝" },
  { action: "Legge il file", detail: "Apre «pratiche-uscite-dicembre.xlsx» (dati inventati): sei pratiche, con classe, tipo, date, adesioni, accompagnatori, quota e documenti.", icon: "📂",
    options: ["Manda subito una mail ai referenti di tutte le pratiche", "Chiede a te di incollare le righe del file", "Apre il file delle pratiche di dicembre"], correct: 2 },
  { action: "Legge solo gli articoli che servono", detail: "Carica la procedura «controllo-uscite» e apre il regolamento soltanto agli articoli utili: 1 (tipi di iniziativa), 3 (preavviso), 4 (accompagnatori), 5 (adesioni), 6 (quota massima), 7 (periodi esclusi) e 9 (documenti). Gli altri restano chiusi.", icon: "📖",
    options: ["Carica la procedura e apre solo gli articoli che servono", "Risponde a memoria, senza aprire il regolamento", "Chiede a te di riassumergli il regolamento"], correct: 0 },
  { action: "Usa uno strumento per calcolare", detail: "Scrive un piccolo programma e lo esegue: per ogni pratica calcola i giorni di preavviso, gli accompagnatori necessari e il 71% delle adesioni. Alcuni risultati: 2ª X, 25 partecipanti, servono 2 accompagnatori e ne ha 1; 4ª Y, il 71% di 24 iscritti è 17,04; 3ª V, 12 giorni di preavviso.", icon: "🧮",
    options: ["Fa i conti a mente, pratica per pratica", "Chiede a te di rifare i conti con la calcolatrice", "Usa un programma per calcolare preavviso, accompagnatori e adesioni"], correct: 2 },
  { action: "Confronta regola per regola", detail: "Trova la 2ª X con 1 accompagnatore invece di 2 (art. 4, commi 1 e 2) e la 5ª W con una quota di 55 euro sopra il tetto di 48 (art. 6, comma 1, lettera b). Nessuna data cade in un periodo escluso (art. 7) e i moduli ci sono tutti. Per la 4ª Y arrotonda 17,04 a 17: le 17 adesioni bastano. Per la 3ª V non sa quale regola usare.", icon: "⚖️",
    options: ["Segna tutte le pratiche come regolari, perché i dati sono completi", "Confronta ogni pratica con le regole e segna dove non tornano", "Corregge da solo nel file i valori che non tornano"], correct: 1 },
  { action: "Si ferma e chiede a te", detail: "La 3ª V va in una città vicina ma rientra entro le 13. L'articolo 1 chiama uscita didattica quella nel comune e dentro l'orario, visita guidata quella di una giornata intera: questo caso il regolamento non lo prevede, e per l'art. 13 decide il dirigente, sentita la Commissione. Con una visita guidata servono 17 giorni di preavviso, con un'uscita didattica 6 giorni di lezione. L'agente non sceglie. Tu rispondi: «Trattala come visita guidata.» Allora i 12 giorni di preavviso non bastano (art. 3, comma 2).", icon: "✋",
    options: ["La considera un'uscita didattica, così la pratica risulta in regola", "La segna come non conforme senza dirti perché", "Si ferma e ti chiede come classificare l'uscita della 3ª V"], correct: 2 },
  { action: "Chiede il permesso di scrivere", detail: "Prima di creare dei file chiede: «Posso creare la cartella bozze-dicembre con un file per ogni referente? Non invio nulla.» Tu rispondi di sì.", icon: "🔐",
    options: ["Chiede il permesso prima di creare i file delle bozze", "Crea i file senza chiedere niente", "Invia le mail e ti avvisa dopo"], correct: 0 },
  { action: "Scrive le bozze", detail: "Crea tre file, per i referenti della 2ª X, della 3ª V e della 5ª W. Ogni bozza dice quale regola non è rispettata, l'articolo e cosa serve per sistemare. Sono testi da leggere: nessuno è stato inviato.", icon: "✍️",
    options: ["Invia le tre mail ai referenti", "Scrive tre file di bozza, senza inviarli", "Cambia nel file la data di partenza della 3ª V per rispettare il preavviso"], correct: 1 },
  { action: "Si controlla", detail: "Rilegge l'articolo 5, comma 1: il risultato si arrotonda sempre per eccesso, quindi 17,04 diventa 18 adesioni. La 4ª Y ne ha 17 e non raggiunge il minimo: l'agente aveva sbagliato. Corregge l'elenco e scrive una quarta bozza nella stessa cartella.", icon: "🔁",
    options: ["Considera il lavoro finito senza riguardarlo", "Cancella tutte le bozze e ricomincia dall'inizio", "Rilegge le regole, trova l'arrotondamento sbagliato e aggiunge la quarta bozza"], correct: 2 },
  { action: "Consegna", detail: "Presenta il riepilogo: 2 pratiche in regola (3ª Z e 1ª T), 4 con problemi (2ª X, 3ª V, 4ª Y, 5ª W), 4 bozze pronte. Ricorda che nulla è stato inviato e che la 3ª V dipende dalla tua scelta. Decidere e inviare tocca a te.", icon: "📬",
    options: ["Invia le quattro bozze e poi consegna il riepilogo", "Consegna il riepilogo e le bozze, senza inviare nulla", "Segna le quattro pratiche come respinte"], correct: 1 },
];

const AGENT_END = "Consegnato. L'agente ha pianificato, letto solo ciò che serviva, calcolato con uno strumento, chiesto a te nel caso dubbio e chiesto il permesso prima di scrivere. Ha corretto un proprio errore e ha lasciato a te la decisione e l'invio.";

const PRATICHE = [
  ['Classe', 'Uscita', 'Tipo', 'Partenza', 'Domanda consegnata', 'Iscritti', 'Partecipanti', 'Accompagnatori', 'Quota', 'Referente'],
  ['3ª Z', 'Biblioteca comunale', 'uscita didattica', 'gio 11 dic', '17 nov', '22', '22', '2', '5 €', 'Ferri'],
  ['4ª Y', 'Azienda alimentare', 'visita guidata', 'mar 16 dic', '21 nov', '24', '17', '2', '30 €', 'Verdi'],
  ['2ª X', 'Museo della tecnica', 'visita guidata', 'ven 12 dic', '20 nov', '27', '25', '1', '22 €', 'Rossi'],
  ['3ª V', 'Mostra e laboratorio in città vicina, rientro entro le 13', 'da definire', 'lun 15 dic', '3 dic', '18', '14', '2', '9 €', 'Bruni'],
  ['5ª W', 'Centro di ricerca', 'visita guidata', 'gio 18 dic', '14 nov', '20', '19', '2', '55 €', 'Conti'],
  ['1ª T', 'Incontro con un autore al teatro', 'uscita didattica', 'mar 9 dic', '24 nov', '21', '21', '2', '6 €', 'Lupi'],
];

function ChatbotColumn() {
  const box = { background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: '8px', padding: '7px 10px', fontSize: 'var(--fs-sm)', color: colors.textDim };
  const mine = { background: colors.bgLight, borderRadius: '8px', padding: '7px 10px', fontSize: 'var(--fs-sm)', color: colors.textDim };
  return (
    <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '9px', display: 'flex', flexDirection: 'column', gap: '4px', minHeight: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '4px' }}>
        <span style={{ fontSize: '26px' }}>💬</span>
        <h3 style={{ color: colors.info, margin: 0 }}>Chatbot</h3>
      </div>
      <div style={mine}><strong style={{ color: colors.text }}>Tu:</strong> {AGENT_TASK}</div>
      <div style={box}><strong style={{ color: colors.info }}>Chatbot:</strong> «Certo, incollami qui le pratiche e il regolamento, poi ti dico quali non vanno.»</div>
      <div style={mine}><strong style={{ color: colors.text }}>Tu:</strong> (incolli le sei righe del file e cerchi da solo nel regolamento gli articoli giusti, sperando di non perderne nessuno)</div>
      <div style={box}><strong style={{ color: colors.info }}>Chatbot:</strong> «La 2ª X sembra avere pochi accompagnatori e la 5ª W una quota alta. La 4ª Y, con 17 adesioni su 24, mi sembra a posto» <em>(il conto è a mente: può sbagliare un arrotondamento)</em>.</div>
      <div style={mine}><strong style={{ color: colors.text }}>Tu:</strong> (rifai tu i giorni di preavviso, decidi da solo come classificare l'uscita della 3ª V e chiedi le mail una alla volta)</div>
      <div style={box}><strong style={{ color: colors.info }}>Chatbot:</strong> «Ecco una bozza per il prof. Rossi…» <em>(poi tocca a te copiarla, correggerla e inviarla)</em></div>
      <div style={{ marginTop: 'auto', paddingTop: '8px', borderTop: `1px dashed ${colors.border}`, fontSize: 'var(--fs-sm)', color: colors.textMuted }}>
        Finisce qui: il testo che risponde. Copiare i dati, cercare gli articoli, controllare ogni conto e preparare ogni messaggio restano compiti tuoi.
      </div>
    </div>
  );
}

function AgentColumn({ compact }) {
  const [step, setStep] = useState(0);
  const [guessMode, setGuessMode] = useState(false);
  const [guess, setGuess] = useState(null);
  const [revealed, setRevealed] = useState(false);
  const [correctCount, setCorrectCount] = useState(0);
  const [totalGuesses, setTotalGuesses] = useState(0);
  const [log, setLog] = useState([AGENT_STEPS[0]]);

  const atEnd = step >= AGENT_STEPS.length - 1;
  const nextStepData = !atEnd ? AGENT_STEPS[step + 1] : null;

  const startGuess = () => { setGuess(null); setRevealed(false); setGuessMode(true); };

  const pickGuess = (idx) => {
    if (revealed) return;
    setGuess(idx);
    setRevealed(true);
    setTotalGuesses(t => t + 1);
    if (idx === nextStepData.correct) setCorrectCount(c => c + 1);
  };

  const advance = () => {
    if (atEnd) return;
    const next = step + 1;
    setStep(next);
    setLog(l => [...l, AGENT_STEPS[next]]);
    setGuessMode(false);
    setGuess(null);
    setRevealed(false);
  };

  const restart = () => {
    setStep(0);
    setLog([AGENT_STEPS[0]]);
    setGuessMode(false);
    setGuess(null);
    setRevealed(false);
    setCorrectCount(0);
    setTotalGuesses(0);
  };

  return (
    <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '10px', padding: '9px', display: 'flex', flexDirection: 'column', gap: '4px', minHeight: '100%' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '8px', marginBottom: '4px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
          <span style={{ fontSize: '26px' }}>🤖</span>
          <h3 style={{ color: colors.success, margin: 0 }}>Agente</h3>
        </div>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 'var(--fs-xs)', color: colors.textMuted }}>
          Previsioni giuste: <strong style={{ color: colors.accent }}>{correctCount}/{totalGuesses}</strong>
        </div>
      </div>

      <div style={{ background: colors.bgLight, borderRadius: '8px', padding: '7px 10px', fontSize: 'var(--fs-sm)', color: colors.textDim }}>
        <strong style={{ color: colors.text }}>Compito:</strong> {AGENT_TASK}
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', maxHeight: compact ? '120px' : '340px', overflowY: 'auto', padding: '4px 0' }}>
        <div style={{ fontSize: 'var(--fs-xs)', textTransform: 'uppercase', letterSpacing: '1px', color: colors.textMuted, fontFamily: "'IBM Plex Mono', monospace" }}>Registro delle azioni</div>
        {log.map((s, i) => (
          <div key={i} style={{ display: 'flex', gap: '10px', alignItems: 'flex-start', background: colors.bg, border: `1px solid ${colors.border}`, borderRadius: '6px', padding: '6px 8px' }}>
            <span style={{ fontSize: '20px' }}>{s.icon}</span>
            <div>
              <div style={{ color: colors.text, fontWeight: 600, fontSize: 'var(--fs-sm)' }}>{s.action}</div>
              <div style={{ color: colors.textDim, fontSize: 'var(--fs-xs)' }}>{s.detail}</div>
            </div>
          </div>
        ))}
      </div>

      {!atEnd && !guessMode && (
        <button onClick={startGuess} style={{ padding: '8px 16px', minHeight: '40px', background: colors.info, border: 'none', borderRadius: '6px', color: colors.bg, fontWeight: 600, cursor: 'pointer', fontSize: 'var(--fs-sm)' }}>
          Indovina la prossima mossa →
        </button>
      )}

      {!atEnd && guessMode && (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
          <div style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)' }}>Cosa farà adesso l'agente?</div>
          {nextStepData.options.map((opt, idx) => {
            let bg = colors.bgLight, border = colors.border, color = colors.textDim;
            if (revealed) {
              if (idx === nextStepData.correct) { bg = colors.success + '25'; border = colors.success; color = colors.text; }
              else if (idx === guess) { bg = colors.danger + '20'; border = colors.danger; color = colors.text; }
            }
            return (
              <button key={idx} onClick={() => pickGuess(idx)} disabled={revealed} style={{ textAlign: 'left', padding: '7px 12px', minHeight: '38px', background: bg, border: `1px solid ${border}`, borderRadius: '6px', color, cursor: revealed ? 'default' : 'pointer', fontSize: 'var(--fs-sm)' }}>
                {opt}
              </button>
            );
          })}
          {revealed && (
            <button onClick={advance} style={{ padding: '8px 16px', minHeight: '40px', background: `linear-gradient(135deg, ${colors.accent}, ${colors.accentAlt})`, border: 'none', borderRadius: '6px', color: colors.bg, fontWeight: 600, cursor: 'pointer', fontSize: 'var(--fs-sm)' }}>
              Avanti →
            </button>
          )}
        </div>
      )}

      {atEnd && (
        <div style={{ background: colors.success + '15', border: `1px solid ${colors.success}40`, borderRadius: '6px', padding: '7px 12px', color: colors.textDim, fontSize: 'var(--fs-sm)' }}>
          {AGENT_END}
        </div>
      )}

      <button onClick={restart} style={{ marginTop: 'auto', alignSelf: 'flex-start', padding: '6px 12px', minHeight: '36px', background: 'transparent', border: `1px solid ${colors.border}`, borderRadius: '6px', color: colors.textMuted, cursor: 'pointer', fontSize: 'var(--fs-xs)' }}>
        ↺ Ricomincia la simulazione
      </button>
    </div>
  );
}

function AgentSimulation({ compact = false }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: compact ? '1fr 1fr' : 'minmax(0,1fr) minmax(0,1.2fr)', gap: '12px', alignItems: 'stretch' }} className="agent-sim-grid">
      <ChatbotColumn />
      <AgentColumn compact={compact} />
    </div>
  );
}

function App() {
  // Scala per schermi grandi (PC, proiettore): sotto 1366x768 e su mobile resta 1.
  const calcZoom = () => (window.innerWidth <= 900 ? 1 : Math.min(2.4, Math.max(1, Math.min(window.innerWidth / 1366, window.innerHeight / 768))));
  const [zoom, setZoom] = useState(calcZoom);
  useEffect(() => {
    const onResize = () => setZoom(calcZoom());
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  return (
    <div style={{ minHeight: '100vh', padding: '24px 20px 60px' }}>
      <div style={{ maxWidth: '1100px', margin: '0 auto', zoom }}>
        <a href="slide.html" style={{ color: colors.textMuted, textDecoration: 'none', fontSize: 'var(--fs-sm)' }}>← Torna alle slide</a>

        <h1 style={{ color: colors.accent, fontSize: 'var(--fs-h2)', marginTop: '18px', marginBottom: '14px' }}>
          Chatbot o agente? Un compito più complesso
        </h1>

        <div style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderLeft: `5px solid ${colors.warn}`, borderRadius: '0 8px 8px 0', padding: '18px 22px', marginBottom: '16px' }}>
          <p style={{ color: colors.textDim, margin: '0 0 10px' }}>
            <strong style={{ color: colors.text }}>Un compito diverso da quello visto insieme sulla slide.</strong> Qui l'agente deve controllare sei pratiche contro il regolamento e preparare dei messaggi. Più avanti si ferma per farti una domanda e chiede un permesso prima di scrivere dei file. Durata indicativa: 10-12 minuti.
          </p>
          <p style={{ color: colors.textDim, margin: 0 }}>
            <strong style={{ color: colors.text }}>Come si gioca:</strong> prima di ogni passo dell'agente premete "Indovina la prossima mossa", scegliete una delle tre opzioni e guardate quale si colora di verde. Poi premete "Avanti" per leggere nel registro cosa ha fatto l'agente. Il contatore in alto a destra della colonna Agente conta le previsioni azzeccate: i passi da indovinare sono nove.
          </p>
        </div>

        <details open style={{ background: colors.bgCard, border: `1px solid ${colors.border}`, borderRadius: '8px', padding: '10px 14px', marginBottom: '22px' }}>
          <summary style={{ cursor: 'pointer', color: colors.text, fontWeight: 600, fontSize: 'var(--fs-sm)' }}>Il file delle pratiche di dicembre (dati inventati)</summary>
          <div style={{ overflowX: 'auto', marginTop: '10px' }}>
            <table style={{ borderCollapse: 'collapse', width: '100%', fontSize: 'var(--fs-xs)', color: colors.textDim }}>
              <thead>
                <tr>{PRATICHE[0].map((h, i) => <th key={i} style={{ textAlign: 'left', padding: '4px 8px', borderBottom: `1px solid ${colors.border}`, color: colors.textMuted, fontWeight: 600, whiteSpace: 'nowrap' }}>{h}</th>)}</tr>
              </thead>
              <tbody>
                {PRATICHE.slice(1).map((r, i) => (
                  <tr key={i}>{r.map((c, k) => <td key={k} style={{ padding: '4px 8px', borderBottom: `1px solid ${colors.border}`, verticalAlign: 'top' }}>{c}</td>)}</tr>
                ))}
              </tbody>
            </table>
          </div>
          <p style={{ color: colors.textMuted, fontSize: 'var(--fs-xs)', margin: '8px 0 0' }}>Il regolamento è quello di prova dell'Istituto Tecnico Dimostrativo (anno 2025/2026). Moduli A e B presenti per tutte le pratiche.</p>
        </details>

        {AgentSimulation ? <AgentSimulation compact={false} /> : (
          <p style={{ color: colors.danger }}>La simulazione non si è caricata. Ricaricate la pagina.</p>
        )}

        <p style={{ color: colors.textMuted, fontSize: 'var(--fs-sm)', marginTop: '24px' }}>
          Dati inventati per l'esercitazione: nessuna pratica, uscita o persona reale della scuola.
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
